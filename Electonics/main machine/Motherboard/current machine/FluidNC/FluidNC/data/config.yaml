name: Water_plot
board: ESP32
use_line_numbers: true
planner_blocks: 20
kinematics:
  corexy:
axes:
  x:
    steps_per_mm: 200
    max_rate_mm_per_min: 10000
    acceleration_mm_per_sec2: 1500
    max_travel_mm: 730
    pen_change_travel_mm: 730
    soft_limits: true
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: true
      feed_mm_per_min: 500
      seek_mm_per_min: 4000
      settle_ms: 250
      seek_scaler: 1.6
      feed_scaler: 1.6
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.36:low
      hard_limits: false
      pulloff_mm: 5
      stepstick:
        step_pin: i2so.5
        direction_pin: i2so.6:low
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
  shared_stepper_disable_pin: i2so.0
  shared_stepper_reset_pin: NO_PIN
  y:
    steps_per_mm: 200
    max_rate_mm_per_min: 10000
    acceleration_mm_per_sec2: 1500
    max_travel_mm: 300
    pen_change_travel_mm: 300
    soft_limits: true
    homing:
      cycle: 3
      mpos_mm: 0
      positive_direction: false
      feed_mm_per_min: 500
      seek_mm_per_min: 4000
      settle_ms: 250
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_all_pin: NO_PIN
      limit_neg_pin: gpio.35:low
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 5
      stepstick:
        step_pin: i2so.1
        direction_pin: i2so.2
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
  z:
    steps_per_mm: 200
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 200
    max_travel_mm: 10
    pen_change_travel_mm: 10
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 0
      feed_mm_per_min: 250
      seek_mm_per_min: 500
      settle_ms: 250
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_all_pin: gpio.34:low
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1
      stepstick:
        step_pin: i2so.3
        direction_pin: i2so.4:low
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
start:
  check_limits: true
  must_home: false
stepping:
  engine: I2S_STATIC 
  idle_ms: 255
  pulse_us: 6
  dir_delay_us: 5
  disable_delay_us: 0
i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17
spi:
  miso_pin: gpio.12
  mosi_pin: gpio.13
  sck_pin: gpio.14
sdcard:
  cs_pin: gpio.15
  card_detect_pin: gpio.39
macros:
  startup_line1: $H
  after_homing: M63 P1
user_outputs:
  digital1_pin: gpio.33
work_area:
  enabled: false
  min_x: -730
  max_x: 0
  min_y: 0
  max_y: 300
  origin_x: 0
  origin_y: 0
  move_to_origin: false


